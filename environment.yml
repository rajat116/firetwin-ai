name: firetwin
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Python version (3.11 or 3.12)
  - python>=3.11,<3.13

  # Core scientific computing
  - numpy>=2.0.0
  - scipy>=1.13.0
  - pandas>=2.2.0

  # Geospatial (conda handles these complex dependencies better)
  - geopandas>=1.0.0
  - shapely>=2.0.0
  - rasterio>=1.3.0
  - pyproj>=3.6.0
  - fiona>=1.9.0
  - gdal>=3.8.0
  
  # Multidimensional arrays
  - xarray>=2024.1.0
  - zarr>=2.18.0
  - dask>=2024.1.0
  - netcdf4>=1.7.0
  - h5netcdf>=1.3.0
  
  # Machine learning (conda-forge or pytorch channel)
  - pytorch>=2.0.0
  - torchvision
  - scikit-learn>=1.5.0
  
  # Configuration and validation
  - pydantic>=2.0.0
  - hydra-core>=1.3.0
  - omegaconf>=2.3.0
  
  # Experiment tracking
  - mlflow>=2.16.0
  
  # CLI and utilities
  - click>=8.1.0
  - rich>=13.0.0
  - tqdm>=4.66.0
  - python-dotenv>=1.0.0
  
  # API and serving
  - fastapi>=0.115.0
  - uvicorn>=0.30.0
  
  # Logging
  - loguru>=0.7.0
  
  # Development tools
  - pytest>=8.0.0
  - pytest-cov>=5.0.0
  - pytest-xdist>=3.6.0
  - ruff>=0.7.0
  - mypy>=1.13.0
  - pre-commit>=4.0.0
  
  # Jupyter and visualization
  - ipykernel>=6.29.0
  - jupyter>=1.1.0
  - matplotlib>=3.9.0
  - seaborn>=0.13.0
  - plotly>=5.24.0
  
  # Data acquisition
  - requests>=2.32.0
  - httpx>=0.27.0
  
  # Additional useful packages
  - pip>=24.0
  
  # Install remaining packages via pip (not available in conda or newer versions)
  - pip:
      - cdsapi>=0.7.0
      - pydantic-settings>=2.5.0
